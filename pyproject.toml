[project]
name = "eft-library-aiops"
version = "0.1.0"
description = "Read-only Codex analysis for EFT Library operations"
readme = "README.md"
authors = [
    { name = "poeynus", email = "poeynus@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aiops"

[project.scripts]
aiops = "aiops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in real Codex invocation", "postgres: opt-in ephemeral PostgreSQL tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
